<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>어르신 한 손 건강 밥상 리빙랩 - 영양 체크 폼</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN for JSX Parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-amber-50/40 text-gray-800 font-sans pb-16">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function NutritionSurveyApp() {
      const [step, setStep] = useState('home');
      const [answers, setAnswers] = useState({
        mealCount: '',
        protein: '',
        veggie: '',
        water: ''
      });

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [step]);

      const handleStart = () => {
        setStep('survey');
        window.scrollTo(0, 0);
      };

      const handleSelect = (key, value) => {
        setAnswers(prev => ({ ...prev, [key]: value }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!answers.mealCount || !answers.protein || !answers.veggie || !answers.water) {
          alert('모든 항목에 답변해 주세요!');
          return;
        }
        setStep('result');
        window.scrollTo(0, 0);
      };

      const handleReset = () => {
        setAnswers({ mealCount: '', protein: '', veggie: '', water: '' });
        setStep('home');
        window.scrollTo(0, 0);
      };

      // 칼로리 및 영양 상태 계산 로직
      const calculateNutrition = () => {
        let estimatedCalories = 0;
        if (answers.mealCount === '1끼 이하') estimatedCalories = 500;
        else if (answers.mealCount === '2끼') estimatedCalories = 1100;
        else if (answers.mealCount === '3끼 정식') estimatedCalories = 1650;

        const hasProtein = answers.protein === '네, 잘 챙겨 먹었습니다';
        const hasVeggie = answers.veggie === '매 끼니 섭취';

        let statusText = '양호하지만 일부 영양 보충이 필요합니다.';
        let statusColor = 'bg-amber-100 text-amber-800 border-amber-300';

        if (answers.mealCount === '3끼 정식' && hasProtein && hasVeggie) {
          statusText = '매우 균형 잡힌 훌륭한 식단입니다!';
          statusColor = 'bg-emerald-100 text-emerald-800 border-emerald-300';
        } else if (answers.mealCount === '1끼 이하' || (!hasProtein && !hasVeggie)) {
          statusText = '영양 섭취 부족 주의가 필요합니다.';
          statusColor = 'bg-rose-100 text-rose-800 border-rose-300';
        }

        return { estimatedCalories, statusText, statusColor, hasProtein, hasVeggie };
      };

      const nutritionResult = step === 'result' ? calculateNutrition() : null;

      return (
        <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between p-4">
          <header class="text-center py-6 border-b border-amber-200/60 bg-white/80 rounded-2xl shadow-sm mb-6">
            <span class="inline-block px-3 py-1 bg-amber-100 text-amber-800 text-xs font-bold rounded-full mb-2">
              지역사회 간호학 리빙랩 프로젝트
            </span>
            <h1 class="text-2xl font-bold text-amber-900 tracking-tight">어르신 한 손 건강 밥상</h1>
            <p class="text-sm text-gray-600 mt-1">오늘 나의 식생활 영양 상태 체크하기</p>
          </header>

          <main class="flex-1">
            {step === 'home' && (
              <div class="bg-white rounded-3xl p-6 shadow-sm border border-amber-100 text-center space-y-6">
                <div class="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mx-auto text-amber-700">
                  <i data-lucide="utensils" class="w-10 h-10"></i>
                </div>
                <div>
                  <h2 class="text-xl font-bold text-gray-800">식사 습관 간단 점검</h2>
                  <p class="text-gray-600 text-sm mt-2 leading-relaxed">
                    몇 가지 간단한 질문으로 오늘 드신 식사의 칼로리와 영양 균형을 확인해보세요.
                  </p>
                </div>
                <button
                  onClick={handleStart}
                  class="w-full py-4 bg-amber-600 hover:bg-amber-700 text-white font-bold text-lg rounded-2xl shadow-md transition active:scale-95 flex items-center justify-center gap-2"
                >
                  <span>설문 시작하기</span>
                  <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
              </div>
            )}

            {step === 'survey' && (
              <form onSubmit={handleSubmit} class="space-y-6">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                  <label class="font-bold text-gray-800 text-base block">
                    1. 오늘 식사는 몇 끼를 드셨나요?
                  </label>
                  <div class="grid grid-cols-3 gap-2">
                    {['1끼 이하', '2끼', '3끼 정식'].map((opt) => (
                      <button
                        type="button"
                        key={opt}
                        onClick={() => handleSelect('mealCount', opt)}
                        class={`py-3 px-2 text-sm font-semibold rounded-xl border transition ${
                          answers.mealCount === opt
                            ? 'bg-amber-600 text-white border-amber-600 shadow-sm'
                            : 'bg-gray-50 text-gray-700 border-gray-200 hover:bg-gray-100'
                        }`}
                      >
                        {opt}
                      </button>
                    ))}
                  </div>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                  <label class="font-bold text-gray-800 text-base block">
                    2. 단백질 식품(고기, 생선, 달걀, 두부 등)을 드셨나요?
                  </label>
                  <div class="grid grid-cols-2 gap-2">
                    {['네, 잘 챙겨 먹었습니다', '아니오, 거의 안 먹었습니다'].map((opt) => (
                      <button
                        type="button"
                        key={opt}
                        onClick={() => handleSelect('protein', opt)}
                        class={`py-3 px-3 text-sm font-semibold rounded-xl border transition text-center ${
                          answers.protein === opt
                            ? 'bg-amber-600 text-white border-amber-600 shadow-sm'
                            : 'bg-gray-50 text-gray-700 border-gray-200 hover:bg-gray-100'
                        }`}
                      >
                        {opt}
                      </button>
                    ))}
                  </div>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                  <label class="font-bold text-gray-800 text-base block">
                    3. 신선한 채소나 나물 반찬을 섭취하셨나요?
                  </label>
                  <div class="grid grid-cols-2 gap-2">
                    {['매 끼니 섭취', '충분히 먹지 못함'].map((opt) => (
                      <button
                        type="button"
                        key={opt}
                        onClick={() => handleSelect('veggie', opt)}
                        class={`py-3 px-3 text-sm font-semibold rounded-xl border transition text-center ${
                          answers.veggie === opt
                            ? 'bg-amber-600 text-white border-amber-600 shadow-sm'
                            : 'bg-gray-50 text-gray-700 border-gray-200 hover:bg-gray-100'
                        }`}
                      >
                        {opt}
                      </button>
                    ))}
                  </div>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                  <label class="font-bold text-gray-800 text-base block">
                    4. 하루 물 섭취량은 어느 정도인가요?
                  </label>
                  <div class="grid grid-cols-3 gap-2">
                    {['3컵 이하', '4~5컵', '6컵 이상'].map((opt) => (
                      <button
                        type="button"
                        key={opt}
                        onClick={() => handleSelect('water', opt)}
                        class={`py-3 px-2 text-sm font-semibold rounded-xl border transition ${
                          answers.water === opt
                            ? 'bg-amber-600 text-white border-amber-600 shadow-sm'
                            : 'bg-gray-50 text-gray-700 border-gray-200 hover:bg-gray-100'
                        }`}
                      >
                        {opt}
                      </button>
                    ))}
                  </div>
                </div>

                <button
                  type="submit"
                  class="w-full py-4 bg-amber-600 hover:bg-amber-700 text-white font-bold text-lg rounded-2xl shadow-md transition active:scale-95 mt-4"
                >
                  결과 확인하기
                </button>
              </form>
            )}

            {step === 'result' && nutritionResult && (
              <div class="bg-white rounded-3xl p-6 shadow-sm border border-amber-100 space-y-6">
                <div class="text-center space-y-2">
                  <div class="w-16 h-16 bg-amber-100 text-amber-700 rounded-full flex items-center justify-center mx-auto mb-2">
                    <i data-lucide="calculator" class="w-8 h-8"></i>
                  </div>
                  <h2 class="text-2xl font-bold text-gray-800">영양 진단 결과</h2>
                  <div class={`inline-block px-4 py-1.5 rounded-full text-xs font-bold border ${nutritionResult.statusColor}`}>
                    {nutritionResult.statusText}
                  </div>
                </div>

                {/* 추정 칼로리 표시 박스 */}
                <div class="bg-amber-50 p-5 rounded-2xl border border-amber-200 text-center space-y-1">
                  <span class="text-xs font-bold text-amber-800">오늘 추정 섭취 칼로리</span>
                  <div class="text-3xl font-extrabold text-amber-900">
                    약 {nutritionResult.estimatedCalories} <span class="text-lg font-bold">kcal</span>
                  </div>
                  <p class="text-xs text-amber-700 mt-1">
                    * 어르신 하루 권장량: 약 1,600 ~ 2,000 kcal
                  </p>
                </div>

                {/* 영양소 피드백 */}
                <div class="space-y-2.5">
                  <h3 class="font-bold text-gray-800 text-sm">💡 맞춤 피드백</h3>
                  
                  <div class="p-3 bg-gray-50 rounded-xl border border-gray-200 text-xs space-y-1">
                    <div class="font-bold text-gray-700">· 단백질 섭취</div>
                    <p class="text-gray-600">
                      {nutritionResult.hasProtein
                        ? '단백질을 잘 챙겨 드시고 계십니다. 근력 유지에 좋습니다.'
                        : '달걀, 두부, 고기, 생선 등 단백질 반찬을 하루 1회 이상 꼭 챙겨 드세요.'}
                    </p>
                  </div>

                  <div class="p-3 bg-gray-50 rounded-xl border border-gray-200 text-xs space-y-1">
                    <div class="font-bold text-gray-700">· 채소 및 비타민</div>
                    <p class="text-gray-600">
                      {nutritionResult.hasVeggie
                        ? '채소를 매 끼니 잘 섭취하고 계십니다.'
                        : '소화와 비타민 섭취를 위해 푹 익힌 나물이나 채소를 매 끼니 드시면 좋습니다.'}
                    </p>
                  </div>

                  <div class="p-3 bg-gray-50 rounded-xl border border-gray-200 text-xs space-y-1">
                    <div class="font-bold text-gray-700">· 수분 보충</div>
                    <p class="text-gray-600">
                      {answers.water === '6컵 이상'
                        ? '수분 섭취 상태가 훌륭합니다.'
                        : '목이 마르지 않더라도 자주 물 한 컵씩 드시는 습관이 필요합니다.'}
                    </p>
                  </div>
                </div>

                <button
                  onClick={handleReset}
                  class="w-full py-3.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-2xl transition active:scale-95 shadow-sm"
                >
                  처음으로 돌아가기
                </button>
              </div>
            )}
          </main>

          <footer class="mt-8 text-center text-xs text-gray-400">
            © 2026 경남대학교 간호학과 리빙랩 프로젝트
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NutritionSurveyApp />);
  </script>
</body>
</html>
